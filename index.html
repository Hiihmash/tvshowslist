<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mash's ShowTrack 1</title>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    
    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/716/716429.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/716/716429.png">
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        
        :root {
            --brand-primary: #8b5cf6;
            --brand-glow: rgba(139, 92, 246, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.72);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid var(--brand-primary);
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .spin-anim { animation: spin 0.8s linear infinite; }

        .tab-active {
            color: var(--brand-primary);
            border-bottom: 2px solid var(--brand-primary);
        }

        .search-type-active {
            background: var(--brand-primary);
            color: white;
        }

        .section-label {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748b;
            margin-bottom: 0.75rem;
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .section-label:first-child { margin-top: 0.5rem; }
        .btn-action { transition: all 0.2s ease; }
        .btn-action:active { transform: scale(0.95); }

        .theme-dot {
            width: 28px; height: 28px;
            border-radius: 999px; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s;
        }
        .theme-dot.active { border-color: white; transform: scale(1.2); }

        .fade-in-list { animation: fadeIn 0.22s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-card px-5 py-3.5 flex justify-between items-center border-b border-slate-800">
        <div>
            <h1 class="text-lg font-extrabold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">Mash's ShowTracker</h1>
            <p id="syncStatusText" class="text-[9px] text-slate-500 font-semibold">Ready</p>
        </div>
        <div class="flex gap-1 items-center">
            <button onclick="manualTabRefresh(true)" class="p-2 hover:bg-slate-800 rounded-full transition-colors text-slate-400" title="Force Refresh Data">
                <i id="refreshIcon" data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
            <button onclick="toggleSearch()" class="p-2 hover:bg-slate-800 rounded-full transition-colors text-slate-400" title="Add Shows">
                <i data-lucide="plus" class="w-6 h-6"></i>
            </button>
            <button onclick="toggleSettings()" class="p-2 hover:bg-slate-800 rounded-full transition-colors text-slate-400" title="Settings">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="sticky top-[61px] z-40 bg-slate-950/85 backdrop-blur-md flex border-b border-slate-800">
        <button onclick="switchTab('watchlist')" id="tab-watchlist" class="relative flex-1 py-3.5 text-[10px] font-bold transition-all flex flex-col items-center gap-1 tab-active">
            <i data-lucide="layers" class="w-4 h-4"></i> WATCHLIST
            <span id="badge-watchlist" class="absolute top-2 right-1/2 translate-x-9 text-[9px] bg-slate-800 px-1.5 py-0.2 rounded-full text-slate-400">0</span>
        </button>
        <button onclick="switchTab('tv')" id="tab-tv" class="relative flex-1 py-3.5 text-[10px] font-bold transition-all flex flex-col items-center gap-1 text-slate-500">
            <i data-lucide="monitor" class="w-4 h-4"></i> TV
            <span id="badge-tv" class="hidden absolute top-2 right-1/2 translate-x-7 text-[9px] bg-pink-600 px-1.5 py-0.2 rounded-full text-white font-bold">0</span>
        </button>
        <button onclick="switchTab('youtube')" id="tab-youtube" class="relative flex-1 py-3.5 text-[10px] font-bold transition-all flex flex-col items-center gap-1 text-slate-500">
            <i data-lucide="play" class="w-4 h-4"></i> YOUTUBE
            <span id="badge-yt" class="hidden absolute top-2 right-1/2 translate-x-9 text-[9px] bg-red-600 px-1.5 py-0.2 rounded-full text-white font-bold">0</span>
        </button>
    </nav>

    <!-- Search Overlay -->
    <div id="searchOverlay" class="fixed inset-0 z-[60] bg-slate-950/95 hidden p-5 flex flex-col">
        <div class="flex items-center gap-3 mb-4">
            <button onclick="toggleSearch()" class="p-2"><i data-lucide="arrow-left" class="w-6 h-6 text-slate-400"></i></button>
            <div class="flex-1 flex bg-slate-800 rounded-xl p-1">
                <button id="searchTypeTV" onclick="setSearchType('tv')" class="flex-1 py-2 text-xs font-bold rounded-lg search-type-active">TV Shows</button>
                <button id="searchTypeYT" onclick="setSearchType('youtube')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400">YouTube</button>
            </div>
        </div>
        <div class="relative mb-5">
            <input type="text" id="searchInput" placeholder="Search TV shows or YouTube channels..." class="w-full bg-slate-800 border border-slate-700/60 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-purple-500 outline-none pr-10 text-sm">
            <button onclick="clearSearch()" class="absolute right-3 top-3 text-slate-500"><i data-lucide="x-circle" class="w-5 h-5"></i></button>
        </div>
        <div id="searchResults" class="flex-1 overflow-y-auto space-y-3 no-scrollbar"></div>
    </div>

    <!-- App Selector Overlay -->
    <div id="appSelectorOverlay" class="fixed inset-0 z-[70] bg-slate-950/90 hidden p-6 flex flex-col justify-center items-center">
        <div class="glass-card w-full max-w-sm rounded-3xl p-6 relative">
            <button onclick="closeAppSelector()" class="absolute top-4 right-4 text-slate-500 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            <h2 class="text-base font-bold mb-4 text-center">Select Streaming App</h2>
            <div id="appSelectorList" class="grid grid-cols-2 gap-2 max-h-[60vh] overflow-y-auto no-scrollbar"></div>
        </div>
    </div>

    <!-- Episode Detail Modal -->
    <div id="epDetailOverlay" class="fixed inset-0 z-[75] bg-slate-950/90 hidden p-6 flex flex-col justify-center items-center" onclick="if(event.target===this) closeEpDetail()">
        <div class="glass-card w-full max-w-md rounded-3xl p-6 relative space-y-4">
            <button onclick="closeEpDetail()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            <div class="flex gap-3 items-center pr-6">
                <img id="epModalImg" src="" class="w-14 h-20 object-cover rounded-xl bg-slate-800">
                <div class="min-w-0">
                    <p id="epModalShow" class="text-xs font-bold text-purple-400 uppercase tracking-wider truncate"></p>
                    <h3 id="epModalTitle" class="text-base font-extrabold text-white leading-snug"></h3>
                    <p id="epModalDate" class="text-[11px] text-slate-400 mt-0.5"></p>
                </div>
            </div>
            <p id="epModalSummary" class="text-xs text-slate-300 leading-relaxed max-h-48 overflow-y-auto no-scrollbar"></p>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button id="epModalWatchSingle" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700">Mark Only This</button>
                <button id="epModalWatchUpTo" class="py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white">Mark Up To Here</button>
            </div>
        </div>
    </div>

    <!-- Settings Overlay -->
    <div id="settingsOverlay" class="fixed inset-0 z-[60] bg-slate-950/95 hidden p-6 flex flex-col overflow-y-auto no-scrollbar">
        <div class="flex items-center gap-4 mb-6">
            <button onclick="toggleSettings()" class="p-2"><i data-lucide="arrow-left" class="w-6 h-6 text-slate-400"></i></button>
            <h2 class="text-xl font-bold">Settings</h2>
        </div>
        <div class="space-y-6 max-w-lg mx-auto w-full">
            <section class="p-4 border border-slate-800 rounded-2xl bg-slate-900/50">
                <label class="block text-xs font-bold text-slate-400 uppercase mb-3">App Theme</label>
                <div class="flex gap-4">
                    <div onclick="setTheme('#8b5cf6')" class="theme-dot bg-purple-500" data-theme="#8b5cf6"></div>
                    <div onclick="setTheme('#3b82f6')" class="theme-dot bg-blue-500" data-theme="#3b82f6"></div>
                    <div onclick="setTheme('#10b981')" class="theme-dot bg-emerald-500" data-theme="#10b981"></div>
                    <div onclick="setTheme('#f43f5e')" class="theme-dot bg-rose-500" data-theme="#f43f5e"></div>
                </div>
            </section>
            
            <section class="p-4 border border-slate-800 rounded-2xl bg-slate-900/50">
                <label class="block text-xs font-bold text-slate-400 uppercase mb-3">Feed History Window</label>
                <div class="flex gap-2">
                    <button onclick="setFeedDays(7)" id="btn-days-7" class="flex-1 py-2 text-xs font-bold rounded-xl border border-slate-700 bg-slate-800 transition-all">7 Days</button>
                    <button onclick="setFeedDays(14)" id="btn-days-14" class="flex-1 py-2 text-xs font-bold rounded-xl border border-slate-700 bg-slate-800 transition-all">14 Days</button>
                    <button onclick="setFeedDays(30)" id="btn-days-30" class="flex-1 py-2 text-xs font-bold rounded-xl border border-slate-700 bg-slate-800 transition-all">30 Days</button>
                </div>
            </section>

            <section class="p-4 border border-slate-800 rounded-2xl bg-slate-900/50 flex justify-around text-center">
                <div><p class="text-[10px] font-bold text-slate-500 uppercase">Followed</p><p id="stat-followed" class="text-xl font-black text-white">0</p></div>
                <div class="w-px bg-slate-800"></div>
                <div><p class="text-[10px] font-bold text-slate-500 uppercase">Watched</p><p id="stat-watched" class="text-xl font-black text-white">0</p></div>
            </section>

            <section>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">YouTube API Key</label>
                <input type="password" id="ytApiKeyInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-purple-500 outline-none text-sm">
            </section>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="exportData()" class="bg-slate-800 hover:bg-slate-700 py-3 rounded-xl text-xs font-bold flex flex-col items-center gap-1.5 border border-slate-700"><i data-lucide="download" class="w-4 h-4"></i> Copy Backup</button>
                <button onclick="importData()" class="bg-slate-800 hover:bg-slate-700 py-3 rounded-xl text-xs font-bold flex flex-col items-center gap-1.5 border border-slate-700"><i data-lucide="upload" class="w-4 h-4"></i> Restore Backup</button>
            </div>
            <button onclick="saveSettings()" class="w-full bg-purple-600 py-4 rounded-2xl font-bold btn-action text-sm">Save Changes</button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="p-4 lg:p-8 max-w-2xl mx-auto">
        <!-- Watchlist Section -->
        <section id="section-watchlist" class="space-y-2">
            <div id="watchlist-header" class="flex justify-between items-center hidden mb-2 px-1">
                <div class="flex items-center gap-2">
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Sort:</p>
                    <select id="watchlistSortSelect" onchange="changeWatchlistSort(this.value)" class="bg-slate-800/80 text-[11px] font-bold text-slate-300 rounded-lg px-2 py-1 border border-slate-700 outline-none">
                        <option value="airdate">Next Airdate</option>
                        <option value="alpha">A - Z</option>
                        <option value="added">Order Added</option>
                    </select>
                </div>
                <button id="btn-readd-all" onclick="reAddAllTV()" class="text-[10px] font-bold px-3 py-1 rounded-full flex items-center gap-1 transition-all opacity-80 hover:opacity-100">
                    <i data-lucide="rotate-ccw" class="w-3 h-3"></i> Re-add Last Ep (All)
                </button>
            </div>
            <div id="watchlistFilterBar" class="hidden mb-4">
                <input type="text" id="watchlistFilterInput" oninput="updateWatchlistFilter()" placeholder="Filter your watchlist..." class="w-full bg-slate-800/60 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-purple-500">
            </div>
            <div id="watchlist-content" class="space-y-2"></div>
            <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-slate-500">
                <i data-lucide="tv" class="w-12 h-12 mb-4 opacity-20"></i>
                <p class="text-sm mb-6">No shows or channels followed yet.</p>
                <button onclick="toggleSearch()" class="flex items-center gap-2 bg-purple-600 hover:bg-purple-500 text-white px-6 py-2.5 rounded-xl text-sm font-bold transition-all shadow-lg active:scale-95">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add First Item
                </button>
            </div>
        </section>

        <!-- TV Releases Section -->
        <section id="section-tv" class="hidden space-y-4">
            <div id="tv-header" class="flex justify-between items-center hidden">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Unwatched Episodes</p>
                <button id="btn-mark-all-tv" onclick="markAllTypeWatched('tv')" class="text-[10px] font-bold px-3 py-1 rounded-full">Mark All Watched</button>
            </div>
            <div id="tvQueue" class="flex flex-col gap-3"></div>
        </section>

        <!-- YouTube Releases Section -->
        <section id="section-youtube" class="hidden space-y-4">
            <div id="yt-header" class="flex justify-between items-center hidden">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">YouTube Feed</p>
                <div class="flex gap-2">
                    <button onclick="syncYouTube()" class="text-[10px] font-bold text-slate-300 px-3 py-1 bg-slate-800 rounded-full flex items-center gap-1"><i data-lucide="refresh-cw" class="w-3 h-3"></i> Sync</button>
                    <button onclick="markAllTypeWatched('youtube')" class="text-[10px] font-bold text-red-400 px-3 py-1 bg-red-400/10 rounded-full">Mark All Watched</button>
                </div>
            </div>
            <div id="ytSyncPrompt" class="flex flex-col items-center justify-center py-16 text-center">
                <i data-lucide="youtube" class="w-12 h-12 mb-4 text-slate-700"></i>
                <p class="text-sm text-slate-400 mb-6">Sync YouTube to check for new videos.<br><span class="text-[10px] text-slate-500">(Batched to save API Quota)</span></p>
                <button onclick="syncYouTube()" class="bg-red-600 hover:bg-red-500 text-white px-7 py-3 rounded-2xl font-bold transition-all shadow-lg shadow-red-900/20 active:scale-95 text-sm">Sync Subscriptions</button>
            </div>
            <div id="ytQueue" class="flex flex-col gap-3"></div>
        </section>
    </main>

    <!-- Toast with optional Undo -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 glass-card px-5 py-3 rounded-2xl border-purple-500/50 shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-[100] flex items-center gap-3">
        <span id="toastMessage" class="text-xs font-semibold"></span>
        <button id="toastUndoBtn" onclick="undoLastAction()" class="hidden text-xs font-extrabold text-purple-400 uppercase tracking-wider hover:underline">Undo</button>
    </div>

    <script>
        const STORAGE_KEY = 'showtrack_v3_data';
        const SETTINGS_KEY = 'showtrack_settings';
        const CACHE_TV_KEY = 'showtrack_tv_cache_v4';
        const CACHE_YT_KEY = 'showtrack_yt_cache_v4';
        const SYNC_META_KEY = 'showtrack_sync_meta_v4';

        // Offline-proof instant SVG fallback image
        const FALLBACK_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='160' viewBox='0 0 120 160'><rect width='100%' height='100%' fill='%231e293b'/><text x='50%' y='50%' fill='%2364748b' font-family='sans-serif' font-size='12' text-anchor='middle' dy='.3em'>No Image</text></svg>";
        
        const STREAMING_APPS = [
            { name: 'Default', url: '', scheme: '' },
            { name: 'Netflix', url: 'https://www.netflix.com', scheme: 'nflx://' },
            { name: 'Disney+', url: 'https://www.disneyplus.com', scheme: 'disneyplus://' },
            { name: 'Max', url: 'https://www.max.com', scheme: 'max://' },
            { name: 'Hulu', url: 'https://www.hulu.com', scheme: 'hulu://' },
            { name: 'Prime Video', url: 'https://www.amazon.com/video', scheme: 'primevideo://' },
            { name: 'Apple TV+', url: 'https://tv.apple.com', scheme: 'videos://' },
            { name: 'Paramount+', url: 'https://www.paramountplus.com', scheme: 'paramountplus://' },
            { name: 'Peacock', url: 'https://www.peacocktv.com', scheme: 'peacock://' },
            { name: 'Crunchyroll', url: 'https://www.crunchyroll.com', scheme: 'crunchyroll://' },
            { name: 'Discovery+', url: 'https://www.discoveryplus.com', scheme: 'discoveryplus://' },
            { name: 'PBS', url: 'https://www.pbs.org', scheme: 'pbsvideo://' },
            { name: 'Hallmark+', url: 'https://www.hallmarkplus.com', scheme: 'hallmarkplus://' }
        ];

        let activeTab = 'watchlist', searchType = 'tv', searchTimeout = null, activeSelectorId = null, toastTimer = null;
        let undoSnapshot = null;
        let isRefreshingTV = false;

        let watchlist = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{"ytApiKey": "AIzaSyAkJtacZcD2TB1IMmWG_umpKmECVr5PYoA", "theme": "#8b5cf6", "lifetimeWatched": 0, "feedDays": 7, "sortBy": "airdate"}');
        if (!settings.feedDays) settings.feedDays = 7;
        if (!settings.sortBy) settings.sortBy = 'airdate';

        // Hydrate cached queues immediately for 0ms startup
        let tvQueue = JSON.parse(localStorage.getItem(CACHE_TV_KEY) || '[]');
        let ytQueue = JSON.parse(localStorage.getItem(CACHE_YT_KEY) || '[]');
        let syncMeta = JSON.parse(localStorage.getItem(SYNC_META_KEY) || '{"lastTvSync": 0, "lastYtSync": 0}');
        let watchlistFilterQuery = '';

        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http') && !window.location.host.includes('goog')) { 
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); 
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme(settings.theme); 
            const apiKeyInput = document.getElementById('ytApiKeyInput');
            if (apiKeyInput) apiKeyInput.value = settings.ytApiKey;
            const sortSelect = document.getElementById('watchlistSortSelect');
            if (sortSelect) sortSelect.value = settings.sortBy;
            
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => performSearch(e.target.value), 350);
                });
            }
            
            updateSyncStatusLabel();
            refreshUI();

            // Background sync TV data automatically if cache is older than 15 minutes or empty
            const fifteenMins = 15 * 60 * 1000;
            if (Date.now() - (syncMeta.lastTvSync || 0) > fifteenMins || tvQueue.length === 0) {
                refreshTVData(false);
            }
        });

        function updateSyncStatusLabel(customText) {
            const el = document.getElementById('syncStatusText');
            if (!el) return;
            if (customText) {
                el.innerText = customText;
                return;
            }
            if (!syncMeta.lastTvSync) {
                el.innerText = 'Not synced yet';
                return;
            }
            const minsAgo = Math.round((Date.now() - syncMeta.lastTvSync) / 60000);
            el.innerText = minsAgo < 1 ? 'Synced just now' : `Synced ${minsAgo}m ago`;
        }

        // Utility: Fetch with automatic retry on 429 rate-limit
        async function fetchWithRetry(url, retries = 3, delay = 1100) {
            for (let i = 0; i < retries; i++) {
                const res = await fetch(url);
                if (res.status === 429) {
                    await new Promise(r => setTimeout(r, delay * (i + 1)));
                    continue;
                }
                return res;
            }
            throw new Error(`Rate limit or network failure for ${url}`);
        }

        function switchTab(tab) {
            activeTab = tab;
            ['section-watchlist', 'section-tv', 'section-youtube'].forEach(s => {
                const el = document.getElementById(s);
                if (el) el.classList.toggle('hidden', s !== `section-${tab}`);
            });
            
            ['watchlist', 'tv', 'youtube'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if (el) el.className = `relative flex-1 py-3.5 text-[10px] font-bold transition-all flex flex-col items-center gap-1 ${tab === t ? 'tab-active' : 'text-slate-500'}`;
            });
            refreshUI(); 
        }

        async function syncYouTube() {
            const syncPrompt = document.getElementById('ytSyncPrompt');
            if (syncPrompt) {
                syncPrompt.classList.remove('hidden');
                syncPrompt.innerHTML = '<div class="loader"></div><p class="mt-4 text-xs text-slate-400">Syncing YouTube channels in parallel...</p>';
            }
            await refreshYouTubeData();
            refreshUI();
            showToast("YouTube feed updated!");
        }

        function manualTabRefresh(forceAll = true) {
            if (activeTab === 'youtube') {
                syncYouTube();
            } else {
                showToast("Refreshing TV schedules...");
                refreshTVData(forceAll).then(() => showToast("TV schedules up to date!"));
            }
        }

        function changeWatchlistSort(val) {
            settings.sortBy = val;
            saveSettings(true);
            refreshUI();
        }

        function getSortedWatchlist(items) {
            const copy = [...items];
            if (settings.sortBy === 'alpha') {
                return copy.sort((a, b) => a.name.localeCompare(b.name));
            }
            if (settings.sortBy === 'airdate') {
                return copy.sort((a, b) => {
                    const tA = a.nextAirDate ? new Date(a.nextAirDate).getTime() : Infinity;
                    const tB = b.nextAirDate ? new Date(b.nextAirDate).getTime() : Infinity;
                    if (tA !== tB) return tA - tB;
                    return a.name.localeCompare(b.name);
                });
            }
            return copy; // 'added'
        }

        function refreshUI() {

                if (!liveItem) return false;
                const epTime = new Date(q.date).getTime();
                const watchedSingle = (liveItem.watchedEpIds || []).includes(q.epId);
                return epTime > (liveItem.lastWatchedAirstamp || 0) && !watchedSingle;

        // Parallel Batched TV Fetcher with Rate-Limit Protection
        async function refreshTVData(forceAll = false) {
            if (isRefreshingTV) return;
            isRefreshingTV = true;

            const icon = document.getElementById('refreshIcon');
            if (icon) icon.classList.add('spin-anim');

            const now = Date.now();
            const historyLimit = now - (settings.feedDays * 86400000);
            const tvItems = watchlist.filter(i => i.type === 'tv');

            // Preserve cached episodes for Ended shows that we skip during quick background sync
            let tempQueue = [];
            let dataChanged = false;

            const itemsToFetch = tvItems.filter(item => {
                if (!forceAll && item.showStatus === 'Ended' && !item.nextAirDate) {
                    const cachedForShow = tvQueue.filter(q => String(q.itemId) === String(item.id));
                    tempQueue.push(...cachedForShow);
                    return false;
                }
                return true;
            });

            const CONCURRENCY = 5;
            for (let i = 0; i < itemsToFetch.length; i += CONCURRENCY) {
                const batch = itemsToFetch.slice(i, i + CONCURRENCY);
                updateSyncStatusLabel(`Syncing TV (${Math.min(i + CONCURRENCY, itemsToFetch.length)}/${itemsToFetch.length})...`);

                await Promise.all(batch.map(async (item) => {
                    try {
                        const res = await fetchWithRetry(`https://api.tvmaze.com/shows/${item.id}/episodes`);
                        if (!res.ok) return;
                        const eps = await res.json();
                        
                        if (Array.isArray(eps)) {
                            const watchedSingles = item.watchedEpIds || [];
                            eps.filter(e => {
                                if (!e.airstamp) return false;
                                const t = new Date(e.airstamp).getTime();
                                return t <= now && t >= historyLimit && t > (item.lastWatchedAirstamp || 0) && !watchedSingles.includes(e.id);
                            }).forEach(e => {
                                tempQueue.push({
                                    epId: e.id,
                                    itemId: item.id,
                                    showName: item.name,
                                    tvApp: item.tvApp || 'Default',
                                    title: `S${String(e.season).padStart(2,'0')}E${String(e.number).padStart(2,'0')}: ${e.name}`,
                                    date: e.airstamp,
                                    url: item.officialSite || e.url,
                                    thumb: e.image?.medium || item.image || FALLBACK_IMG,
                                    summary: (e.summary || 'No episode summary available.').replace(/<[^>]*>?/gm, '')
                                });
                            });
                            
                            const nextEp = eps.find(e => e.airstamp && new Date(e.airstamp).getTime() > now);
                            const newDate = nextEp ? nextEp.airstamp : null;
                            const newInfo = nextEp ? `S${nextEp.season}E${nextEp.number}` : null;
                            
                            if (item.nextAirDate !== newDate || item.nextEpInfo !== newInfo) {
                                item.nextAirDate = newDate;
                                item.nextEpInfo = newInfo;
                                dataChanged = true;
                            }
                        }
                    } catch (e) {
                        console.warn(`TV Fetch skipped for ${item.name}:`, e);
                        // Keep previously cached queue items for this show if offline/error
                        const cachedForShow = tvQueue.filter(q => String(q.itemId) === String(item.id));
                        tempQueue.push(...cachedForShow);
                    }
                }));

                // Small 250ms breather between batches of 5 to stay well below TVMaze rate limits
                if (i + CONCURRENCY < itemsToFetch.length) {
                    await new Promise(r => setTimeout(r, 250));
                }
            }

            tvQueue = tempQueue;
            localStorage.setItem(CACHE_TV_KEY, JSON.stringify(tvQueue));
            syncMeta.lastTvSync = Date.now();
            localStorage.setItem(SYNC_META_KEY, JSON.stringify(syncMeta));

            if (dataChanged) saveData();
            isRefreshingTV = false;
            if (icon) icon.classList.remove('spin-anim');
            updateSyncStatusLabel();
            refreshUI();
        }

        function parseDuration(duration) {
            if (!duration) return 0;
            const matches = duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (!matches) return 0;
            const hours = parseInt(matches[1] || 0);
            const minutes = parseInt(matches[2] || 0);
            const seconds = parseInt(matches[3] || 0);
            return hours * 3600 + minutes * 60 + seconds;
        }

        // Parallel YouTube Fetcher with Batched Video Duration Lookup
        async function refreshYouTubeData() {
            const now = Date.now();
            const historyLimit = now - (settings.feedDays * 86400000);
            const ytItems = watchlist.filter(i => i.type === 'youtube');
            if (ytItems.length === 0) return;

            let rawUploads = [];

            // Step 1: Fetch channel activities in parallel batches of 5
            const CONCURRENCY = 5;
            for (let i = 0; i < ytItems.length; i += CONCURRENCY) {
                const batch = ytItems.slice(i, i + CONCURRENCY);
                await Promise.all(batch.map(async (item) => {
                    try {
                        const res = await fetch(`https://www.googleapis.com/youtube/v3/activities?part=snippet,contentDetails&channelId=${item.id}&maxResults=8&key=${settings.ytApiKey}`);
                        const data = await res.json();
                        if (data && Array.isArray(data.items)) {
                            data.items.filter(v => v.snippet.type === 'upload').forEach(v => {
                                const t = new Date(v.snippet.publishedAt).getTime();
                                if (t >= historyLimit && t > (item.lastWatchedAirstamp || 0)) {
                                    rawUploads.push({
                                        item,
                                        videoId: v.contentDetails.upload.videoId,
                                        title: v.snippet.title,
                                        date: v.snippet.publishedAt,
                                        thumb: v.snippet.thumbnails?.medium?.url || item.image || FALLBACK_IMG
                                    });
                                }
                            });
                        }
                    } catch (e) { console.error("YT Channel Error:", e); }
                }));
            }

            // Step 2: Batch up to 50 video IDs per request to check durations (saves API quota & speed)
            const videoMetadata = {};
            const allVideoIds = [...new Set(rawUploads.map(u => u.videoId))];
            for (let i = 0; i < allVideoIds.length; i += 50) {
                const idChunk = allVideoIds.slice(i, i + 50).join(',');
                try {
                    const vRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${idChunk}&key=${settings.ytApiKey}`);
                    const vData = await vRes.json();
                    if (vData && Array.isArray(vData.items)) {
                        vData.items.forEach(v => {
                            videoMetadata[v.id] = parseDuration(v.contentDetails?.duration);
                        });
                    }
                } catch (e) { console.error("YT Duration Batch Error:", e); }
            }

            // Step 3: Filter by user preference (Videos / Shorts / Both)
            let tempQueue = [];
            rawUploads.forEach(u => {
                const pref = u.item.ytPref || 'videos';
                const duration = videoMetadata[u.videoId] || 0;
                const isShort = duration > 0 && duration < 120;

                let shouldInclude = false;
                if (pref === 'both') shouldInclude = true;
                else if (pref === 'shorts' && isShort) shouldInclude = true;
                else if (pref === 'videos' && !isShort) shouldInclude = true;

                if (shouldInclude) {
                    tempQueue.push({
                        epId: u.videoId,
                        itemId: u.item.id,
                        showName: u.item.name,
                        title: u.title,
                        date: u.date,
                        url: `https://youtube.com/watch?v=${u.videoId}`,
                        thumb: u.thumb
                    });
                }
            });

            ytQueue = tempQueue;
            localStorage.setItem(CACHE_YT_KEY, JSON.stringify(ytQueue));
            syncMeta.lastYtSync = Date.now();
            localStorage.setItem(SYNC_META_KEY, JSON.stringify(syncMeta));
        }

        function cycleYtPref(id) {
            const idx = watchlist.findIndex(i => i.id == id);
            if (idx === -1) return;
            const current = watchlist[idx].ytPref || 'videos';
            const prefs = ['videos', 'shorts', 'both'];
            const next = prefs[(prefs.indexOf(current) + 1) % prefs.length];
            watchlist[idx].ytPref = next;
            saveData(); refreshUI();
            showToast(`Filter set to: ${next.toUpperCase()}`);
        }

                        ${isTV ? `<button onclick="openAppSelector('${item.id}')" class="text-[9px] px-2 py-0.5 rounded-md border border-slate-700 bg-slate-800 text-slate-300 font-bold uppercase hover:border-purple-500/50 flex items-center gap-1">

        function renderQueue(items, type) {
            const sortedItems = [...items].sort((a,b) => new Date(b.date) - new Date(a.date));
            let html = '';
            let currentGroup = '';

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const yesterday = today - 86400000;
            const last7 = today - (7 * 86400000);
            const last14 = today - (14 * 86400000);

            sortedItems.forEach((q, index) => {
                if (type === 'tv') {
                    let group = '';
                    const qTime = new Date(q.date).getTime();
                    
                    if (qTime >= today) group = 'Today';
                    else if (qTime >= yesterday) group = 'Yesterday';
                    else if (qTime >= last7) group = 'Last 7 Days';
                    else if (qTime >= last14) group = 'Last 14 Days';
                    else group = 'Older';

                    if (group !== currentGroup) {
                        const mtClass = index === 0 ? 'mt-1' : 'mt-5';
                        html += `<div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ${mtClass} ml-1 flex items-center gap-1.5"><i data-lucide="calendar" class="w-3 h-3"></i> ${group}</div>`;
                        currentGroup = group;
                    }
                }
                
                const safeUrl = (q.url || '').replace(/'/g, "\\'");
                html += `
                <div class="glass-card rounded-2xl overflow-hidden border-l-4 fade-in-list" style="border-left-color: ${type === 'tv' ? '#ec4899' : '#ef4444'}">
                    <div class="flex items-center gap-3.5 p-3">
                        <img src="${q.thumb || FALLBACK_IMG}" loading="lazy" class="w-20 h-12 object-cover rounded-lg bg-slate-800 shrink-0" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
                        <div onclick="${type === 'tv' ? `launchApp('${q.itemId}', '${safeUrl}')` : `window.open('${safeUrl}', '_blank')`}" class="flex-1 min-w-0 block active:opacity-70 cursor-pointer">
                            <p class="text-[9px] text-slate-400 uppercase font-bold tracking-wider mb-0.5">${type === 'tv' ? (q.tvApp || 'TV') : 'YouTube'} • ${new Date(q.date).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</p>
                            <h4 class="font-bold text-sm truncate text-white">${q.showName}</h4>
                            <p class="text-xs text-slate-300 truncate">${q.title}</p>
                        </div>
                        ${type === 'tv' ? `<button onclick="openEpDetail('${q.epId}')" class="p-2.5 text-slate-400 hover:text-white rounded-xl transition-colors" title="Episode Info"><i data-lucide="info" class="w-5 h-5"></i></button>` : ''}
                        <button onclick="markWatched('${q.itemId}', ${new Date(q.date).getTime()})" class="p-2.5 bg-slate-800/90 hover:bg-slate-700 rounded-xl active:scale-90 transition-transform" title="Mark Watched"><i data-lucide="check-circle" class="w-6 h-6 text-emerald-400"></i></button>
                    </div>
                </div>`;
            });

            return html;
        }

        async function reAddLast(id, type) {
            const item = watchlist.find(i => i.id == id);
            if (!item) return;
            showToast("Fetching latest release...");
            try {
                if (type === 'tv') {
                    const res = await fetchWithRetry(`https://api.tvmaze.com/shows/${id}/episodes`);
                    const eps = await res.json();
                    const aired = eps.filter(e => e.airstamp && new Date(e.airstamp) <= new Date());
                    if (aired.length) {
                        const lastEp = aired[aired.length - 1];
                        const lastTime = new Date(lastEp.airstamp).getTime();
                        item.lastWatchedAirstamp = lastTime - 1;
                        item.watchedEpIds = (item.watchedEpIds || []).filter(epId => epId !== lastEp.id);
                    }
                    saveData();
                    await refreshTVData(true);
                    showToast("Re-added latest episode!");
                } else {
                    const res = await fetch(`https://www.googleapis.com/youtube/v3/activities?part=snippet,contentDetails&channelId=${id}&maxResults=1&key=${settings.ytApiKey}`);
                    const data = await res.json();
                    if (data && data.items?.[0]) {
                        const lastTime = new Date(data.items[0].snippet.publishedAt).getTime();
                        item.lastWatchedAirstamp = lastTime - 1;
                    }
                    saveData();
                    await refreshYouTubeData();
                    refreshUI();
                    showToast("Re-added latest video!");
                }
            } catch(e) { showToast("Failed to re-add."); }
        }

        async function reAddAllTV() {
            const tvItems = watchlist.filter(i => i.type === 'tv');
            if (tvItems.length === 0) return;
            
            showToast("Re-adding last episode for all TV shows...");
            const CONCURRENCY = 5;
            try {
                for (let i = 0; i < tvItems.length; i += CONCURRENCY) {
                    const batch = tvItems.slice(i, i + CONCURRENCY);
                    await Promise.all(batch.map(async (item) => {
                        const res = await fetchWithRetry(`https://api.tvmaze.com/shows/${item.id}/episodes`);
                        const eps = await res.json();
                        if (Array.isArray(eps)) {
                            const aired = eps.filter(e => e.airstamp && new Date(e.airstamp) <= new Date());
                            if (aired.length) {
                                const lastTime = new Date(aired[aired.length - 1].airstamp).getTime();
                                item.lastWatchedAirstamp = lastTime - 1;
                                item.watchedEpIds = [];
                            }
                        }
                    }));
                }
                saveData();
                await refreshTVData(true);
                showToast("All TV shows reset to latest episode!");
            } catch (e) {
                showToast("Error resetting some feeds.");
            }
        }

        function saveUndoState() {
            undoSnapshot = {
                watchlist: JSON.parse(JSON.stringify(watchlist)),
                tvQueue: JSON.parse(JSON.stringify(tvQueue)),
                ytQueue: JSON.parse(JSON.stringify(ytQueue)),
                lifetimeWatched: settings.lifetimeWatched
            };
        }

        function undoLastAction() {
            if (!undoSnapshot) return;
            watchlist = undoSnapshot.watchlist;
            tvQueue = undoSnapshot.tvQueue;
            ytQueue = undoSnapshot.ytQueue;
            settings.lifetimeWatched = undoSnapshot.lifetimeWatched;
            undoSnapshot = null;

            saveData();
            saveSettings(true);
            localStorage.setItem(CACHE_TV_KEY, JSON.stringify(tvQueue));
            localStorage.setItem(CACHE_YT_KEY, JSON.stringify(ytQueue));
            refreshUI();
            showToast("Action undone!");
        }

        function markSingleEpWatched(itemId, epId) {
            const idx = watchlist.findIndex(s => String(s.id) === String(itemId));
            if (idx > -1) {
                saveUndoState();
                if (!watchlist[idx].watchedEpIds) watchlist[idx].watchedEpIds = [];
                watchlist[idx].watchedEpIds.push(epId);
                settings.lifetimeWatched++;
                tvQueue = tvQueue.filter(q => String(q.epId) !== String(epId));
                localStorage.setItem(CACHE_TV_KEY, JSON.stringify(tvQueue));
                saveData(); saveSettings(true); refreshUI();
                showToast("Episode marked watched", true);
            }
        }

        function markWatched(id, time) {
            const idx = watchlist.findIndex(s => String(s.id) === String(id));
            if (idx > -1) { 
                saveUndoState();
                watchlist[idx].lastWatchedAirstamp = Math.max(watchlist[idx].lastWatchedAirstamp || 0, time); 
                settings.lifetimeWatched++; 
                
                tvQueue = tvQueue.filter(q => !(String(q.itemId) === String(id) && new Date(q.date).getTime() <= watchlist[idx].lastWatchedAirstamp));
                ytQueue = ytQueue.filter(q => !(String(q.itemId) === String(id) && new Date(q.date).getTime() <= watchlist[idx].lastWatchedAirstamp));

                localStorage.setItem(CACHE_TV_KEY, JSON.stringify(tvQueue));
                localStorage.setItem(CACHE_YT_KEY, JSON.stringify(ytQueue));
                saveData(); saveSettings(true); refreshUI(); 
                showToast("Marked watched!", true);
            }
        }

        function markAllTypeWatched(type) {
            const queue = type === 'tv' ? tvQueue : ytQueue;
            if (!queue.length) return;
            saveUndoState();
            const count = queue.length;

            queue.forEach(q => {
                const item = watchlist.find(i => String(i.id) === String(q.itemId));
                if (item) item.lastWatchedAirstamp = Math.max(item.lastWatchedAirstamp || 0, new Date(q.date).getTime());
            });
            settings.lifetimeWatched += count;
            
            if (type === 'tv') {
                tvQueue = [];
                localStorage.setItem(CACHE_TV_KEY, '[]');
            } else {
                ytQueue = [];
                localStorage.setItem(CACHE_YT_KEY, '[]');
            }

            saveData(); saveSettings(true); refreshUI();
            showToast(`Cleared ${count} items`, true);
        }

        function applyTheme(c) { 
            const color = c || '#8b5cf6';
            document.documentElement.style.setProperty('--brand-primary', color); 
            document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.theme === color));
            const activeTabEl = document.querySelector('.tab-active');
            if (activeTabEl) { activeTabEl.style.color = color; activeTabEl.style.borderBottomColor = color; }
            document.querySelectorAll('.bg-purple-600').forEach(b => b.style.backgroundColor = color);
            
            const readdAllBtn = document.getElementById('btn-readd-all');
            if (readdAllBtn) {
                readdAllBtn.style.color = color;
                readdAllBtn.style.backgroundColor = color + '1A'; 
            }

            const markAllTvBtn = document.getElementById('btn-mark-all-tv');
            if (markAllTvBtn) {
                markAllTvBtn.style.color = color;
                markAllTvBtn.style.backgroundColor = color + '1A';
            }

            const activeModalBtn = document.querySelector('#appSelectorList .bg-purple-600');
            if (activeModalBtn) activeModalBtn.style.backgroundColor = color;
            updateSettingsUI();
        }

        function setTheme(c) { settings.theme = c; applyTheme(c); saveSettings(true); }

        function setFeedDays(d) {
            settings.feedDays = d;
            updateSettingsUI();
            saveSettings(true);
            refreshTVData(false);
            showToast(`Feed window set to ${d} days`);
        }

        function updateSettingsUI() {
            [7, 14, 30].forEach(d => {
                const btn = document.getElementById(`btn-days-${d}`);
                if (btn) {
                    const isActive = settings.feedDays === d;
                    btn.style.borderColor = isActive ? settings.theme : '';
                    btn.style.backgroundColor = isActive ? settings.theme : '';
                    btn.classList.toggle('text-white', isActive);
                    btn.classList.toggle('text-slate-400', !isActive);
                }
            });
        }

        function toggleSearch() {
            const overlay = document.getElementById('searchOverlay');
            overlay.classList.toggle('hidden');
            if (!overlay.classList.contains('hidden')) {
                setTimeout(() => document.getElementById('searchInput')?.focus(), 50);
            }
        }

        function toggleSettings() { 
            document.getElementById('settingsOverlay').classList.toggle('hidden'); 
            const fld = document.getElementById('stat-followed');
            const wtd = document.getElementById('stat-watched');
            if (fld) fld.innerText = watchlist.length; 
            if (wtd) wtd.innerText = settings.lifetimeWatched || 0; 
            updateSettingsUI();
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            document.getElementById('searchResults').innerHTML = '';
            input.focus();
        }

        function updateWatchlistFilter() { 
            const input = document.getElementById('watchlistFilterInput');
            watchlistFilterQuery = input ? input.value.toLowerCase() : ''; 
            refreshUI(); 
        }

        function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(watchlist)); }
        function saveSettings(silent) { 
            const input = document.getElementById('ytApiKeyInput');
            if (input) settings.ytApiKey = input.value;
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); 
            if (!silent) { toggleSettings(); refreshUI(); refreshTVData(false); } 
        }

        function showToast(m, allowUndo = false) { 
            const t = document.getElementById('toast'); 
            const msg = document.getElementById('toastMessage');
            const undoBtn = document.getElementById('toastUndoBtn');
            if (t && msg) {
                clearTimeout(toastTimer);
                msg.innerText = m; 
                if (undoBtn) undoBtn.classList.toggle('hidden', !allowUndo);
                t.classList.remove('opacity-0', 'pointer-events-none'); 
                t.classList.add('translate-y-[-10px]');
                toastTimer = setTimeout(() => {
                    t.classList.add('opacity-0', 'pointer-events-none');
                    t.classList.remove('translate-y-[-10px]');
                }, allowUndo ? 4000 : 2200); 
            }
        }

        function removeManual(id) {
            if (confirm("Unfollow this show/channel?")) {
                watchlist = watchlist.filter(s => String(s.id) !== String(id));
                tvQueue = tvQueue.filter(q => String(q.itemId) !== String(id));
                ytQueue = ytQueue.filter(q => String(q.itemId) !== String(id));
                localStorage.setItem(CACHE_TV_KEY, JSON.stringify(tvQueue));
                localStorage.setItem(CACHE_YT_KEY, JSON.stringify(ytQueue));
                saveData();
                refreshUI();
            }
        }

        async function performSearch(q) {
            if (!q || q.trim().length < 2) return;
            const resDiv = document.getElementById('searchResults');
            if (!resDiv) return;
            resDiv.innerHTML = '<div class="flex justify-center p-8"><div class="loader"></div></div>';
            try {
                if (searchType === 'tv') {
                    const r = await fetchWithRetry(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);
                    const d = await r.json();
                    resDiv.innerHTML = d.length ? d.map(i => renderSearchResult(i.show, 'tv')).join('') : '<p class="text-center text-xs text-slate-500 py-8">No TV shows found.</p>';
                } else {
                    if (!settings.ytApiKey) {
                        resDiv.innerHTML = '<p class="text-center text-xs text-red-400 p-4">Please add a YouTube API Key in settings first.</p>';
                        return;
                    }
                    const r = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&q=${encodeURIComponent(q)}&key=${settings.ytApiKey}`);
                    const d = await r.json();
                    if (d.error) throw new Error(d.error.message);
                    resDiv.innerHTML = d.items?.length ? d.items.map(i => renderSearchResult({
                        id: i.snippet.channelId,
                        name: i.snippet.channelTitle,
                        image: i.snippet.thumbnails?.default?.url || FALLBACK_IMG
                    }, 'youtube')).join('') : '<p class="text-center text-xs text-slate-500 py-8">No YouTube channels found.</p>';
                }
            } catch (e) {
                resDiv.innerHTML = `<p class="text-center text-xs text-red-400 p-4">${e.message || 'Search failed. Try again.'}</p>`;
            }
            lucide.createIcons();
        }

		// Global map to hold search results securely without attribute string breaking
        let searchMap = {};

        function renderSearchResult(s, type) {
            const isAdded = watchlist.some(w => String(w.id) === String(s.id));
            const themeColor = settings.theme || '#8b5cf6';
            const imgUrl = s.image?.medium || s.image || FALLBACK_IMG;
            const platform = s.network?.name || s.webChannel?.name || (type === 'youtube' ? 'YouTube' : 'Streaming');
            const status = s.status || 'Running';

            // Store object in memory map using its unique ID
            searchMap[s.id] = {
                id: s.id,
                name: s.name,
                image: imgUrl,
                type: type,
                officialSite: s.officialSite || '',
                platform: platform,
                showStatus: status
            };

            return `<div class="flex gap-4 p-3 glass-card rounded-2xl items-center">
                <img src="${imgUrl}" loading="lazy" class="w-12 h-16 rounded-lg object-cover bg-slate-800 shrink-0" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
                <div class="flex-1 min-w-0">
                    <h4 class="font-bold text-sm truncate">${s.name}</h4>
                    <p class="text-[10px] text-slate-400 truncate">${platform}${type === 'tv' && s.premiered ? ` • ${s.premiered.slice(0,4)}` : ''}${status === 'Ended' ? ' • Ended' : ''}</p>
                    <button onclick="toggleFollow('${s.id}')" class="text-[10px] px-3.5 py-1.5 rounded-lg mt-2 font-bold transition-all" style="background-color: ${isAdded ? '#334155' : themeColor}; color: ${isAdded ? '#94a3b8' : 'white'}">${isAdded ? 'Following' : '+ Follow'}</button>
                </div>
            </div>`;
        }

        function toggleFollow(id) {
            const d = searchMap[id];
            if (!d) return;

            const idx = watchlist.findIndex(s => String(s.id) === String(id));
            if (idx > -1) {
                watchlist.splice(idx, 1);
                tvQueue = tvQueue.filter(q => String(q.itemId) !== String(id));
                ytQueue = ytQueue.filter(q => String(q.itemId) !== String(id));
                localStorage.setItem(CACHE_TV_KEY, JSON.stringify(tvQueue));
                localStorage.setItem(CACHE_YT_KEY, JSON.stringify(ytQueue));
            } else {
                watchlist.push({ ...d, lastWatchedAirstamp: 0, ytPref: 'videos', tvApp: 'Default', watchedEpIds: [] });
                if (d.type === 'tv') refreshTVData(true);
            }
            saveData();
            refreshUI(); 
            performSearch(document.getElementById('searchInput').value);
        }

        function setSearchType(t) { 
            searchType = t; 
            const btnTV = document.getElementById('searchTypeTV');
            const btnYT = document.getElementById('searchTypeYT');
            if (btnTV) btnTV.className = `flex-1 py-2 text-xs font-bold rounded-lg ${t === 'tv' ? 'search-type-active' : 'text-slate-400'}`; 
            if (btnYT) btnYT.className = `flex-1 py-2 text-xs font-bold rounded-lg ${t === 'youtube' ? 'search-type-active' : 'text-slate-400'}`; 
            performSearch(document.getElementById('searchInput').value); 
        }

        function exportData() {
            navigator.clipboard.writeText(JSON.stringify({ watchlist, settings }));
            showToast("Backup copied to clipboard!");
        }

        function importData() { 
            const p = prompt("Paste backup JSON data:"); 
            if (p) { 
                try {
                    const d = JSON.parse(p); 
                    watchlist = d.watchlist || [];
                    settings = { ...settings, ...(d.settings || {}) }; 
                    saveData();
                    saveSettings(true);
                    refreshTVData(true);
                    showToast("Backup restored! Syncing shows...");
                } catch(e) {
                    showToast("Invalid backup data.");
                }
            } 
        }
    </script>
</body>
</html>
